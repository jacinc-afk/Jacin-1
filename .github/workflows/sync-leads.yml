name: Sync leads

# Defaults to a dry run. Creating records in a live CRM is not something to do
# by accident, so writing requires explicitly setting apply to true.
on:
  # Every 20 minutes through the working day, Florida time. A lead posted at
  # 9:05 is in AccuLynx and assigned before 9:30, which is the point — a lead
  # that sits until someone remembers to press a button is the problem this
  # replaces.
  #
  # Cron here is UTC. 11:00-23:00 UTC covers 7am-7pm during daylight time and
  # 6am-6pm during standard time, so the working day is covered year round
  # without chasing the clock change. Monday to Saturday.
  schedule:
    - cron: '*/20 11-23 * * 1-6'

  workflow_dispatch:
    inputs:
      apply:
        description: 'Create records in AccuLynx (false = dry run, prints only)'
        type: boolean
        default: false
      lookback_days:
        description: 'How many days of chat history to read'
        type: string
        default: '7'
      max_creates:
        description: 'Stop after this many new leads (0 = no limit)'
        type: string
        default: '0'
      target:
        description: 'Where to write. live = each lead to its own department'
        type: choice
        options: [test, live, reroof, service, warranties]
        default: test

permissions:
  # The rotation pointer is committed back after an apply run — it is the only
  # record of whose turn it is, and a run that forgot it would repeat a turn.
  contents: write

concurrency:
  # Two runs at once could both see a lead as new and create it twice. A
  # scheduled run every 20 minutes makes this load-bearing rather than
  # theoretical: a slow run must finish before the next one starts.
  group: sync-leads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to push the rotation pointer back to this branch.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Sync
        run: node src/sync.js
        env:
          # A scheduled run has no inputs, so its settings are spelled out
          # here rather than left to fall through to a default. Writing this as
          # `inputs.apply || 'true'` would be a trap: GitHub treats the boolean
          # false as falsy, so a manual dry run would silently become an apply.
          SYNC_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
          # Twenty minutes of new posts, with two days of overlap so a few
          # hours of failed runs — or a GitHub outage — costs nothing. Anything
          # already synced is skipped by its dedup stamp.
          SYNC_LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '2' || inputs.lookback_days }}
          # Capped even on the schedule. Nothing should ever produce twenty new
          # leads in twenty minutes, so hitting this means something is wrong —
          # and the cap turns "wrong" into twenty records instead of hundreds.
          # Anything held back is picked up by the next run, unchanged.
          SYNC_MAX_CREATES: ${{ github.event_name == 'schedule' && '20' || inputs.max_creates }}
          ACCULYNX_TARGET: ${{ github.event_name == 'schedule' && 'live' || inputs.target }}
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          RC_SERVER_URL: ${{ secrets.RC_SERVER_URL }}
          ACCULYNX_API_KEY_TEST: ${{ secrets.ACCULYNX_API_KEY_TEST }}
          # The history search reads all three departments regardless of which
          # one is being written to — a returning customer is only visible from
          # the company that holds their old job.
          ACCULYNX_KEY_REROOF: ${{ secrets.ACCULYNX_KEY_REROOF }}
          ACCULYNX_KEY_SERVICE: ${{ secrets.ACCULYNX_KEY_SERVICE }}
          ACCULYNX_KEY_WARRANTIES: ${{ secrets.ACCULYNX_KEY_WARRANTIES }}
          # Optional. Without it the deterministic matching stands alone and
          # the judgment step is skipped entirely.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Prints the real field names on prior jobs, so the guessed ones in
          # summariseJob can be replaced with what AccuLynx actually returns.
          SYNC_DUMP_JOB_KEYS: 'true'
          RC_FLAG_CHAT_ID: ${{ secrets.RC_FLAG_CHAT_ID }}

      - name: Save the rotation pointer
        # Only after a real apply run, and only when it actually moved. A dry
        # run must leave no trace, and an unchanged file must not produce an
        # empty commit on every run.
        #
        # A scheduled run has no inputs, so `inputs.apply` alone is empty and
        # therefore false — this step was being skipped on exactly the runs
        # that matter. The pointer would have stayed at zero forever and every
        # reroof lead would have gone to the first person in the rotation, with
        # nothing in the output to say so.
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if git diff --quiet -- state/rotation.json; then
            echo "Rotation unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/rotation.json
          git commit -m "Advance the lead rotation pointer"
          git push origin HEAD:${{ github.ref_name }}
