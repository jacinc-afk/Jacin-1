name: Sync RingCentral voicemails to AccuLynx leads

on:
  # Uncomment the schedule once all repo secrets are configured:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-leads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run sync
        env:
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          RC_SERVER_URL: ${{ secrets.RC_SERVER_URL }}
          ACCULYNX_API_KEY: ${{ secrets.ACCULYNX_API_KEY }}
          ACCULYNX_API_BASE: ${{ secrets.ACCULYNX_API_BASE }}

      - name: Persist processed-message state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed.json
          git diff --cached --quiet || git commit -m "chore: update processed voicemail state [skip ci]"
          git push
